name: Check Links

  # This removes the Node.js 20 deprecation warning

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --timeout 30
            --retry-wait-time 3
            --exclude '^data:'
            --exclude 'github-readme-stats.vercel.app'
            --exclude 'github-readme-activity-graph.vercel.app'
            --exclude 'npmjs.com'
            README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: Issue creation removed - just fail the workflow, don't spam issues
